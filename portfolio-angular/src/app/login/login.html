<section class="login">

  <mat-card>
    <mat-card-header>
      <mat-card-title>Área de Gestão 🔐</mat-card-title>
      <mat-card-subtitle>
        Faça login para acessar a área administrativa.
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>

      <form (ngSubmit)="entrar()">

        <mat-form-field appearance="outline">
          <mat-label>Usuário</mat-label>
          <input
            matInput
            id="usuario"
            type="text"
            [(ngModel)]="usuario"
            name="usuario"
            required
          >
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Senha</mat-label>
          <input
            matInput
            id="senha"
            type="password"
            [(ngModel)]="senha"
            name="senha"
            required
          >
        </mat-form-field>

        @if (erro) {
          <p class="erro">{{ erro }}</p>
        }

        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="entrando"
        >
          {{ entrando ? 'Entrando...' : 'Entrar' }}
        </button>

      </form>

    </mat-card-content>
  </mat-card>

</section>
